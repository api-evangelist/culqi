      operationId: captureCharge
      tags: [Charges]
      summary: Capture a pre-authorized charge
      description: Captures a charge that was created with capture=false (authorization hold).
      security:
        - secretKey: []
      responses:
        '200':
          description: Captured charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
  /orders:
    post:
      operationId: createOrder
      tags: [Orders]
      summary: Create an order
      description: >-
        Creates a payment order used by asynchronous methods such as
