          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    secretKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_/sk_test_ secret key
      description: >-
        Server-side secret key sent as an HTTP Bearer token in the
        Authorization header, e.g. `Authorization: Bearer sk_live_...`.
    publicKey:
      type: http
      scheme: bearer
      bearerFormat: pk_live_/pk_test_ public key
      description: >-
        Public key sent as an HTTP Bearer token for tokenization and 3DS
        confirm on the secure host, e.g. `Authorization: Bearer pk_live_...`.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: The unique resource identifier.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records to return (max 100).
      schema:
        type: integer
        default: 10
        maximum: 100
    Before:
      name: before
      in: query
      required: false
      description: Cursor - return records created before this id.
      schema:
        type: string
    After:
      name: after
      in: query
      required: false
      description: Cursor - return records created after this id.
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CurrencyCode:
      type: string
      description: ISO currency code. Culqi supports PEN and USD.
      enum: [PEN, USD]
    Metadata:
      type: object
      description: Arbitrary key/value metadata attached to a resource.
      additionalProperties:
        type: string
    MetadataUpdate:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
    Deleted:
      type: object
      properties:
        deleted:
          type: boolean
        id:
          type: string
        merchant_message:
          type: string
    Error:
      type: object
      properties:
        object:
          type: string
          example: error
        type:
          type: string
          example: card_error
        merchant_message:
          type: string
        user_message:
          type: string
        param:
          type: string
        code:
          type: string
    CreateTokenRequest:
      type: object
      required: [card_number, cvv, expiration_month, expiration_year, email]
      properties:
        card_number:
          type: string
          example: '4111111111111111'
        cvv:
          type: string
          example: '123'
        expiration_month:
          type: string
          example: '09'
        expiration_year:
          type: string
          example: '2028'
        email:
          type: string
          format: email
        metadata:
          $ref: '#/components/schemas/Metadata'
    CreateYapeTokenRequest:
      type: object
      required: [amount, otp, number_phone]
      properties:
        amount:
          type: integer
          description: Amount in minor units (cents).
        otp:
          type: string
          description: Yape approval code entered by the payer.
        number_phone:
          type: string
          description: Payer Yape phone number.
        metadata:
          $ref: '#/components/schemas/Metadata'
    Token:
      type: object
      properties:
        object:
          type: string
          example: token
        id:
          type: string
          example: tkn_test_xxxxxxxxxxxx
        type:
          type: string
          example: card
        email:
          type: string
        creation_date:
          type: integer
        card_number:
          type: string
          example: '411111******1111'
        last_four:
          type: string
        active:
          type: boolean
        iin:
          $ref: '#/components/schemas/Iin'
        client:
          type: object
          additionalProperties: true
        metadata:
          $ref: '#/components/schemas/Metadata'
    TokenList:
      $ref: '#/components/schemas/PaginatedList'
    ConfirmRequest:
      type: object
      required: [token_id]
      properties:
        token_id:
          type: string
        usermail:
          type: string
    CreateChargeRequest:
      type: object
      required: [amount, currency_code, email, source_id]
      properties:
        amount:
          type: integer
          description: Amount to charge in the currency minor unit (cents), e.g. 10000 = S/100.00.
          example: 10000
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        email:
          type: string
          format: email
        source_id:
          type: string
          description: Token id (tkn_...), Yape token (ype_...) or saved card id (crd_...).
        description:
          type: string
          maxLength: 80
        capture:
          type: boolean
          description: When false, creates an authorization hold to be captured later.
          default: true
        installments:
          type: integer
          description: Number of installments for Cuotealo (installment) payments.
        antifraud_details:
          type: object
          additionalProperties: true
        metadata:
          $ref: '#/components/schemas/Metadata'
    Charge:
      type: object
      properties:
        object:
          type: string
          example: charge
        id:
          type: string
          example: chr_test_xxxxxxxxxxxx
        amount:
          type: integer
        amount_refunded:
          type: integer
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        email:
          type: string
        description:
          type: string
        source:
          type: object
          additionalProperties: true
        outcome:
          type: object
          additionalProperties: true
        capture:
          type: boolean
        creation_date:
          type: integer
        metadata:
          $ref: '#/components/schemas/Metadata'
    ChargeList:
      $ref: '#/components/schemas/PaginatedList'
    CreateOrderRequest:
      type: object
      required: [amount, currency_code, description, order_number, client_details, expiration_date]
      properties:
        amount:
          type: integer
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        description:
          type: string
        order_number:
          type: string
        client_details:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
            phone_number:
              type: string
        expiration_date:
          type: integer
          description: Unix timestamp when the order (e.g. PagoEfectivo CIP) expires.
        payment_methods:
          type: object
          additionalProperties: true
        metadata:
          $ref: '#/components/schemas/Metadata'
    ConfirmOrderRequest:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: string
    Order:
      type: object
      properties:
        object:
          type: string
          example: order
        id:
          type: string
          example: ord_test_xxxxxxxxxxxx
        amount:
          type: integer
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        state:
          type: string
          example: created
        order_number:
          type: string
        cip_code:
          type: string
          description: PagoEfectivo CIP payment code, when applicable.
        expiration_date:
          type: integer
        creation_date:
          type: integer
        metadata:
          $ref: '#/components/schemas/Metadata'
    OrderList:
      $ref: '#/components/schemas/PaginatedList'
    CreateRefundRequest:
      type: object
      required: [amount, charge_id, reason]
      properties:
        amount:
          type: integer
          description: Amount to refund in minor units. Omit or match charge amount for a full refund.
        charge_id:
          type: string
        reason:
          type: string
          enum: [duplicado, fraudulento, solicitud_comprador]
        metadata:
          $ref: '#/components/schemas/Metadata'
    Refund:
      type: object
      properties:
        object:
          type: string
          example: refund
        id:
          type: string
          example: ref_test_xxxxxxxxxxxx
        amount:
          type: integer
        charge_id:
          type: string
        reason:
          type: string
        creation_date:
          type: integer
        metadata:
          $ref: '#/components/schemas/Metadata'
    RefundList:
      $ref: '#/components/schemas/PaginatedList'
    CreateCustomerRequest:
      type: object
      required: [first_name, last_name, email, address, address_city, country_code, phone_number]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        address_city:
          type: string
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 country code, e.g. PE.
          example: PE
        phone_number:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
    Customer:
      type: object
      properties:
        object:
          type: string
          example: customer
        id:
          type: string
          example: cus_test_xxxxxxxxxxxx
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        creation_date:
          type: integer
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        metadata:
          $ref: '#/components/schemas/Metadata'
    CustomerList:
      $ref: '#/components/schemas/PaginatedList'
    CreateCardRequest:
      type: object
