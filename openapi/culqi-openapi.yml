        metadata:
          $ref: '#/components/schemas/Metadata'
    UpdateCardRequest:
      type: object
      properties:
        token_id:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
    Card:
      type: object
      properties:
        object:
          type: string
          example: card
        id:
          type: string
          example: crd_test_xxxxxxxxxxxx
        customer_id:
          type: string
        source:
          type: object
          additionalProperties: true
        creation_date:
          type: integer
        metadata:
          $ref: '#/components/schemas/Metadata'
    CardList:
      $ref: '#/components/schemas/PaginatedList'
    CreatePlanRequest:
