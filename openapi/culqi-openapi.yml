# Provenance: MODELED-FROM-DOCS (grounded=modeled-from-docs).
# Culqi does not publish a downloadable OpenAPI/Swagger document; the API
# reference at https://apidocs.culqi.com/ is a client-rendered SPA with no
# fetchable spec artifact (openapi.json/yaml return the SPA HTML shell).
# This document was modeled from Culqi's live developer documentation
# (https://docs.culqi.com/), the API reference (https://apidocs.culqi.com/),
# and the official open-source SDKs (github.com/culqi/culqi-python,
# culqi-go, culqi-php), verified July 2026.
# Hosts confirmed live: api.culqi.com (server-side, secret key sk_) and
# secure.culqi.com (tokenization + 3DS confirm, public key pk_).
openapi: 3.0.3
info:
  title: Culqi API v2
  description: >-
    Culqi is a Peruvian online payments platform (a Grupo Credicorp / Krealo
    company) that lets businesses accept card, Yape, PagoEfectivo, mobile
    wallet and Cuotealo (installment) payments. The REST API v2 exposes
    tokenization, charges (cargos), orders, refunds, customers, cards, plans,
    subscriptions, webhook events, card-BIN (iin) lookup and transfers.
    Card data is tokenized client-side against the PCI-scoped secure host;
    all money-movement and management operations run against the server host
    with a secret key. Amounts are integers in the currency minor unit
    (cents); supported currencies are PEN (Peruvian Sol) and USD.
  termsOfService: https://culqi.com/terminos_y_condiciones/
  contact:
    name: Culqi Developer Support
    url: https://docs.culqi.com/
  version: '2.0'
servers:
  - url: https://api.culqi.com/v2
    description: Server-side host for charges, orders, refunds, customers, cards, plans, subscriptions, events, iins and transfers (authenticated with a secret key, sk_).
  - url: https://secure.culqi.com/v2
    description: PCI-scoped host for card tokenization and 3DS charge confirmation (authenticated with a public key, pk_).
tags:
  - name: Tokens
    description: Client-side tokenization of card and Yape credentials on the secure host.
  - name: Charges
    description: One-time charges (cargos) against a token or saved card.
  - name: Orders
    description: Payment orders for PagoEfectivo (CIP) and bank-transfer / cash-agent flows.
  - name: Refunds
    description: Full or partial refunds (devoluciones) of a charge.
  - name: Customers
    description: Stored customer (cliente) profiles.
  - name: Cards
    description: Cards saved against a customer for recurring or one-click charges.
  - name: Plans
    description: Recurring-billing plan definitions.
  - name: Subscriptions
    description: Subscriptions linking a saved card to a plan.
  - name: Events
    description: Webhook event objects representing account activity.
  - name: Iins
    description: Card BIN / IIN metadata lookup.
  - name: Transfers
    description: Settlement transfers (abonos) paid out to the merchant.
  - name: 3DS
    description: 3-D Secure charge confirmation on the secure host.
paths:
  /tokens:
    servers:
      - url: https://secure.culqi.com/v2
    post:
      operationId: createToken
      tags: [Tokens]
      summary: Create a card token
      description: >-
        Tokenizes card data on the PCI-scoped secure host using the public
        key (pk_). The resulting token id (tkn_...) is single-use and is
        passed as source_id when creating a charge.
      security:
        - publicKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    get:
      operationId: listTokens
      tags: [Tokens]
      summary: List tokens
      security:
        - secretKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: A paginated list of tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenList'
  /tokens/yape:
    servers:
      - url: https://secure.culqi.com/v2
    post:
      operationId: createYapeToken
      tags: [Tokens]
      summary: Create a Yape token
      description: >-
        Tokenizes a Yape (BCP mobile wallet) approval code and phone number
        into a single-use token (ype_...) for use as a charge source_id.
      security:
        - publicKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateYapeTokenRequest'
      responses:
        '201':
          description: Yape token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/Error'
  /tokens/{id}:
    servers:
      - url: https://secure.culqi.com/v2
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: getToken
      tags: [Tokens]
      summary: Retrieve a token
      security:
        - secretKey: []
      responses:
        '200':
          description: Token object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateToken
      tags: [Tokens]
      summary: Update token metadata
      security:
        - secretKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataUpdate'
      responses:
        '200':
          description: Updated token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
  /confirm:
    servers:
      - url: https://secure.culqi.com/v2
    post:
      operationId: confirmCharge
      tags: [3DS]
      summary: Confirm a 3DS-authenticated charge
      description: >-
        Confirms a charge whose token was authenticated via Culqi 3DS.
        Sent to the secure host with the public key after the cardholder
        completes the 3-D Secure challenge.
      security:
        - publicKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Confirmation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/Error'
  /charges:
    post:
      operationId: createCharge
      tags: [Charges]
      summary: Create a charge
      description: >-
        Creates a one-time charge (cargo) against a token, saved card or
        Yape token. amount is an integer in the currency minor unit (cents),
        currency_code is PEN or USD.
      security:
        - secretKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChargeRequest'
      responses:
        '201':
          description: Charge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
