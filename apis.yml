  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.culqi.com/es/documentacion/pagos-online/pago-efectivo/resumen/
  baseURL: https://api.culqi.com/v2
  properties:
  - url: https://docs.culqi.com/es/documentacion/pagos-online/pago-efectivo/resumen/
    type: Documentation
  - url: https://apidocs.culqi.com/
    type: APIReference
  - url: openapi/culqi-openapi.yml
    type: OpenAPI
  - url: collections/culqi.postman_collection.json
    type: PostmanCollection
  description: Payment orders for asynchronous methods such as PagoEfectivo
    (generates a CIP code) and bank transfers, with create, confirm, retrieve,
    list, update and delete operations.
- aid: culqi:culqi-refunds-api
  name: Culqi Refunds API
