aid: culqi
url: https://raw.githubusercontent.com/api-evangelist/culqi/refs/heads/main/apis.yml
name: Culqi
kind: company
description: Culqi is a Peruvian online payments platform and a Grupo Credicorp /
  Krealo company. Its REST API v2 lets businesses accept card, Yape, PagoEfectivo,
  mobile wallet and Cuotealo (installment) payments in PEN and USD, with card data
  tokenized client-side against a PCI-scoped secure host and all money movement,
  subscriptions and webhooks driven from a server-side secret key.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Payment Gateway
- FinTech
- Peru
- LatAm
- Cards
- Yape
created: '2026-07-17'
modified: '2026-07-17'
specificationVersion: '0.19'
apis:
- aid: culqi:culqi-tokens-api
  name: Culqi Tokens API
  tags:
  - Tokens
  - Tokenization
  - PCI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.culqi.com/es/documentacion/pagos-online/api-directa/introduccion/
  baseURL: https://secure.culqi.com/v2
  properties:
  - url: https://docs.culqi.com/es/documentacion/culqi-js/v4/culqi-js/
    type: Documentation
  - url: https://apidocs.culqi.com/
    type: APIReference
  - url: openapi/culqi-openapi.yml
    type: OpenAPI
  - url: collections/culqi.postman_collection.json
    type: PostmanCollection
  description: Client-side tokenization of card and Yape credentials on the
    PCI-scoped secure host using the public key (pk_). Returns a single-use token
    (tkn_/ype_) used as the source_id for a charge, plus 3DS charge confirmation.
- aid: culqi:culqi-charges-api
  name: Culqi Charges API
  tags:
  - Charges
  - Payments
  - Cargos
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.culqi.com/es/documentacion/pagos-online/cargo-unico/resumen/
  baseURL: https://api.culqi.com/v2
  properties:
  - url: https://docs.culqi.com/es/documentacion/pagos-online/cargo-unico/cargos/
    type: Documentation
  - url: https://apidocs.culqi.com/
    type: APIReference
  - url: openapi/culqi-openapi.yml
    type: OpenAPI
  - url: collections/culqi.postman_collection.json
    type: PostmanCollection
  description: Create, capture, retrieve and list one-time charges (cargos)
    against a token, saved card or Yape token. Amounts are integers in the
    currency minor unit (cents); currency_code is PEN or USD. Supports
    authorization holds and Cuotealo installments.
