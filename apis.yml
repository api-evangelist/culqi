aid: culqi
url: https://raw.githubusercontent.com/api-evangelist/culqi/refs/heads/main/apis.yml
name: Culqi
kind: company
description: Culqi is a Peruvian online payments platform and a Grupo Credicorp /
  Krealo company. Its REST API v2 lets businesses accept card, Yape, PagoEfectivo,
  mobile wallet and Cuotealo (installment) payments in PEN and USD, with card data
  tokenized client-side against a PCI-scoped secure host and all money movement,
  subscriptions and webhooks driven from a server-side secret key.
